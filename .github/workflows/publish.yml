name: Publish to PyPI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Notify Slack (build started)
        run: |
          curl -sf -X POST -H 'Content-type: application/json' \
            --data "{
              \"attachments\": [{
                \"color\": \"#2196F3\",
                \"blocks\": [{
                  \"type\": \"section\",
                  \"text\": {
                    \"type\": \"mrkdwn\",
                    \"text\": \":large_blue_circle: *Build started* — <${{ github.server_url }}/${{ github.repository }}|${{ github.repository }}> #${{ github.run_number }}\n<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}> on \`${{ github.ref_name }}\` by ${{ github.actor }}\"
                  }
                }]
              }]
            }" \
            "${{ secrets.SLACK_WEBHOOK }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with dev dependencies
        run: |
          pip install -q --only-binary :all: ".[dev]"
          pip install -q -e . --no-deps

      - name: Lint with ruff
        run: ruff check src tests

      - name: Check formatting with black
        run: black --check src tests

      - name: Run tests
        run: pytest

  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Get version
        id: version
        run: |
          version=$(grep -oP '(?<=__version__ = ")[^"]+' src/posture/__init__.py)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install build tools
        run: pip install -q build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1 (v1.14.2)
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  notify:
    needs: [test, publish]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Determine status
        id: status
        run: |
          if [ "${{ needs.test.result }}" = "success" ] && [ "${{ needs.publish.result }}" != "failure" ]; then
            echo "emoji=:white_check_mark:" >> "$GITHUB_OUTPUT"
            if [ "${{ needs.publish.result }}" = "success" ]; then
              echo "text=Build succeeded — published v${{ needs.publish.outputs.version }} to PyPI" >> "$GITHUB_OUTPUT"
            else
              echo "text=Build succeeded" >> "$GITHUB_OUTPUT"
            fi
            echo "color=#36A64F" >> "$GITHUB_OUTPUT"
          else
            echo "emoji=:x:" >> "$GITHUB_OUTPUT"
            echo "text=Build failed" >> "$GITHUB_OUTPUT"
            echo "color=#E01E5A" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Slack (build result)
        run: |
          curl -sf -X POST -H 'Content-type: application/json' \
            --data "{
              \"attachments\": [{
                \"color\": \"${{ steps.status.outputs.color }}\",
                \"blocks\": [{
                  \"type\": \"section\",
                  \"text\": {
                    \"type\": \"mrkdwn\",
                    \"text\": \"${{ steps.status.outputs.emoji }} *${{ steps.status.outputs.text }}* — <${{ github.server_url }}/${{ github.repository }}|${{ github.repository }}> #${{ github.run_number }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run> on \`${{ github.ref_name }}\` by ${{ github.actor }}\"
                  }
                }]
              }]
            }" \
            "${{ secrets.SLACK_WEBHOOK }}"
