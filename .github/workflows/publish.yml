name: Publish to PyPI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check version is aligned and bumped
        run: |
          pip install -q packaging
          python - <<'EOF'
          import re
          import sys
          import tomllib
          import urllib.request
          from pathlib import Path

          from packaging.version import Version

          with open("pyproject.toml", "rb") as fh:
              pyproject = Version(tomllib.load(fh)["project"]["version"])

          init = Version(
              re.search(
                  r'__version__ = "([^"]+)"',
                  Path("src/posture/__init__.py").read_text(),
              ).group(1)
          )

          test = Version(
              re.search(
                  r'posture\.__version__ == "([^"]+)"',
                  Path("tests/test_posture.py").read_text(),
              ).group(1)
          )

          locations = {"pyproject.toml": pyproject, "__init__.py": init, "test_posture.py": test}
          if len({str(v) for v in locations.values()}) != 1:
              print("Version mismatch across locations:")
              for name, value in locations.items():
                  print(f"  {name}: {value}")
              sys.exit(1)

          local = pyproject
          with urllib.request.urlopen("https://pypi.org/pypi/posture/json") as resp:
              import json

              published = Version(json.load(resp)["info"]["version"])

          print(f"local={local}  published={published}")
          # if local <= published:
          #     print(f"Local version {local} must be greater than published {published} — bump it.")
          #     sys.exit(1)
          EOF

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Notify Slack (build started)
        run: |
          curl -sf -X POST -H 'Content-type: application/json' \
            --data "{
              \"attachments\": [{
                \"color\": \"#2196F3\",
                \"blocks\": [{
                  \"type\": \"section\",
                  \"text\": {
                    \"type\": \"mrkdwn\",
                    \"text\": \":large_blue_circle: *Build started* — <${{ github.server_url }}/${{ github.repository }}|${{ github.repository }}> #${{ github.run_number }}\n<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}> on \`${{ github.ref_name }}\` by ${{ github.actor }}\"
                  }
                }]
              }]
            }" \
            "${{ secrets.SLACK_WEBHOOK }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with dev dependencies
        run: |
          pip install -q --only-binary :all: ".[dev]"
          pip install -q -e . --no-deps

      - name: Lint with ruff
        run: ruff check src tests

      - name: Check formatting with black
        run: black --check src tests

      - name: Run tests
        run: pytest

  publish:
    needs: [version-check, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Get version
        id: version
        run: |
          version=$(grep -oP '(?<=__version__ = ")[^"]+' src/posture/__init__.py)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install build tools
        run: pip install -q build

      - name: Build package
        run: python -m build

      # - name: Publish to PyPI
      #   uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1 (v1.14.2)
      #   with:
      #     password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Announce on Mastodon
        env:
          API_ENDPOINT: ${{ secrets.MASTODON_API_ENDPOINT }}
          ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -o pipefail
          API_ENDPOINT="$(printf '%s' "$API_ENDPOINT" | tr -d '\r\n')"
          ACCESS_TOKEN="$(printf '%s' "$ACCESS_TOKEN" | tr -d '\r\n')"
          STATUS=$(cat <<EOF
          📦 posture v${VERSION} is now on PyPI

          Continuous Compliance Monitoring — collect posture data from your cloud and SaaS estate, parse it into a consistent schema, and store it wherever you like.

          Install / upgrade:
              pip install --upgrade posture

          🐍 PyPI: https://pypi.org/project/posture/${VERSION}/

          #posture #compliance #python #devsecops
          EOF
          )

          echo "STATUS length: ${#STATUS}"

          HTTP_STATUS=$(curl --silent --show-error --verbose \
              -o /tmp/mastodon_response.json -w '%{http_code}' \
              -X POST "${API_ENDPOINT%/}/api/v1/statuses" \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              --data-urlencode "status=${STATUS}" \
              --data-urlencode "visibility=public" \
              2> /tmp/mastodon_verbose.log)

          echo "::group::curl verbose log"
          sed 's/Authorization: Bearer .*/Authorization: Bearer ***REDACTED***/' /tmp/mastodon_verbose.log
          echo "::endgroup::"

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "Mastodon API returned HTTP $HTTP_STATUS:"
            cat /tmp/mastodon_response.json
            exit 1
          fi

          command -v jq >/dev/null 2>&1 && jq -r '"Posted: \(.url)"' /tmp/mastodon_response.json || cat /tmp/mastodon_response.json

  notify:
    needs: [version-check, test, publish]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Determine status
        id: status
        run: |
          if [ "${{ needs.version-check.result }}" = "success" ] && [ "${{ needs.test.result }}" = "success" ] && [ "${{ needs.publish.result }}" != "failure" ]; then
            echo "emoji=:white_check_mark:" >> "$GITHUB_OUTPUT"
            if [ "${{ needs.publish.result }}" = "success" ]; then
              echo "text=Build succeeded — published v${{ needs.publish.outputs.version }} to PyPI" >> "$GITHUB_OUTPUT"
            else
              echo "text=Build succeeded" >> "$GITHUB_OUTPUT"
            fi
            echo "color=#36A64F" >> "$GITHUB_OUTPUT"
          else
            echo "emoji=:x:" >> "$GITHUB_OUTPUT"
            echo "text=Build failed" >> "$GITHUB_OUTPUT"
            echo "color=#E01E5A" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Slack (build result)
        run: |
          curl -sf -X POST -H 'Content-type: application/json' \
            --data "{
              \"attachments\": [{
                \"color\": \"${{ steps.status.outputs.color }}\",
                \"blocks\": [{
                  \"type\": \"section\",
                  \"text\": {
                    \"type\": \"mrkdwn\",
                    \"text\": \"${{ steps.status.outputs.emoji }} *${{ steps.status.outputs.text }}* — <${{ github.server_url }}/${{ github.repository }}|${{ github.repository }}> #${{ github.run_number }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run> on \`${{ github.ref_name }}\` by ${{ github.actor }}\"
                  }
                }]
              }]
            }" \
            "${{ secrets.SLACK_WEBHOOK }}"
